name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow-dispatch:

jobs:
  build-linux:
    runs-on: [linux, docker]

    container:
      image: sagax/ssg-ci:local
      options: >-
        --volume /mnt/largeshare:/mnt/largeshare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          export LOCAL_ARTIFACTS="${GITHUB_WORKSPACE:-/workspace}/artifacts"
          export REMOTE_ARTIFACTS="/mnt/largeshare/temp/pipelines/scg"
          mkdir -p "$LOCAL_ARTIFACTS"
          mkdir -p "$REMOTE_ARTIFACTS"
          echo "ARTIFACTS_DIR=$LOCAL_ARTIFACTS" >> $GITHUB_ENV
          echo "REMOTE_ARTIFACTS=$REMOTE_ARTIFACTS" >> $GITHUB_ENV

      - name: Build with docker compose
        run: |
          docker compose -f tools/docker/docker-compose.builder.linux.yml run --rm --build builder

      - name: Move artifacts
        run: |
          mv "$ARTIFACTS_DIR"/* "$REMOTE_ARTIFACTS/"

  build-windows:
    runs-on: [windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on host
        run: .\tools\build_win.ps1
        shell: powershell
